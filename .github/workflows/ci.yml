name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python scripts/check_public.py
      - run: uv run pytest -q

  plugin-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - name: Install Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - run: uv sync --locked
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Test plugin sandbox
        run: |
          uv run pytest -q -rs tests/test_plugin_sandbox.py --junitxml="$RUNNER_TEMP/sandbox-results.xml"
          uv run python - "$RUNNER_TEMP/sandbox-results.xml" <<'PYTHON'
          import sys
          import xml.etree.ElementTree as ET

          cases = ET.parse(sys.argv[1]).iter("testcase")
          nonpassing = ("skipped", "failure", "error")
          if not any(all(case.find(tag) is None for tag in nonpassing) for case in cases):
              sys.exit("No plugin sandbox test passed.")
          PYTHON
