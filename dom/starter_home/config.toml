# Dom instance config. No secrets here: those go in .env.
# owner_id is written by the bot when you send /claim <code>.
timezone = "UTC"
window_size = 80
daily_spend_cap_usd = 1.0  # 0 disables the cap
leak_check = true  # needs the triage (Jev) model; skipped without it
leak_threshold = 1.2
ephemeral_replies = false

[models.chat]
base_url = "https://openrouter.ai/api/v1"
model = "deepseek/deepseek-v4.1-flash-1017"
api_key_env = "OPENROUTER_API_KEY"

[models.triage]
base_url = "https://openrouter.ai/api/alpha"
model = "~typesafe/jev-latest"
api_key_env = "OPENROUTER_API_KEY"

[models.media]
base_url = "https://openrouter.ai/api/v1"
model = "qwen/qwen3.8-omni-flash"
api_key_env = "OPENROUTER_API_KEY"

[models.search]
base_url = "https://openrouter.ai/api/v1"
model = "deepseek/deepseek-v4.1-flash-1017"
api_key_env = "OPENROUTER_API_KEY"

[desktop]
mode = "off"
image = "ghcr.io/agent-infra/sandbox:latest"
url = ""
api_key_env = "SANDBOX_API_KEY"
start_timeout_seconds = 180
idle_minutes = 10
profile_dir = ""  # defaults to DOM_HOME/../desktop-profile
network = "dom-desktop"
subnet = "172.30.0.0/24"
port = 18080
task_cost_cap_usd = 0.5  # a desktop task stops once its model calls cost this much; 0 turns it off
fallback_usd_per_1k_tokens = 0.002  # prices desktop calls whose provider reports no cost, for task_cost_cap_usd only; keep it conservative
lan_probes = []  # LAN "ipv4:port" or "<name>.local:port" targets the sandbox must not reach, e.g. ["192.0.2.1:443"]; names resolve on every check; required in local mode
probe_image = "alpine:3.22"  # image of the isolation probe; pull it first, probes never pull
probe_control = "1.1.1.1:443"  # public "ipv4:port" the probe container must reach, or the probe cannot prove isolation
remote_isolation_confirmed = false  # remote mode only: set true once you have checked the remote host blocks your LAN

[openers]
enabled = true
max_per_day = 2

[web]
enabled = false
bind = "127.0.0.1"
port = 8080
access_team = ""
access_aud = ""
access_emails = []  # optional: only these Access identities (the JWT email claim); empty admits anyone the Access policy admits
dev_token_env = ""  # env var name, for local testing
public_url = ""  # dashboard base URL for desktop handoff links

[t3]
enabled = false
port = 39731
# base_url defaults to the loopback origin at the configured port.
version = "0.1.10"
node = "~/.local/node/bin/node"

[update]
repo_url = "https://github.com/lcwlouis/tele-friend-bot.git"  # /update offers this repository's vX.Y.Z tags
