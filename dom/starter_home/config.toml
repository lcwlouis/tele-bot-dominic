# Dom instance config. No secrets here: those go in .env.
# owner_id is written by the bot when you send /claim <code>.
timezone = "UTC"
window_size = 80
daily_spend_cap_usd = 1.0  # 0 disables the cap
leak_check = true  # needs the triage (Jev) model; skipped without it
leak_threshold = 1.2
ephemeral_replies = false

[models.chat]
base_url = "https://openrouter.ai/api/v1"
model = "deepseek/deepseek-v4.1-flash-1017"
api_key_env = "OPENROUTER_API_KEY"

[models.triage]
base_url = "https://openrouter.ai/api/alpha"
model = "~typesafe/jev-latest"
api_key_env = "OPENROUTER_API_KEY"

[models.media]
base_url = "https://openrouter.ai/api/v1"
model = "qwen/qwen3.8-omni-flash"
api_key_env = "OPENROUTER_API_KEY"

[models.search]
base_url = "https://openrouter.ai/api/v1"
model = "deepseek/deepseek-v4.1-flash-1017"
api_key_env = "OPENROUTER_API_KEY"

[desktop]
mode = "off"
image = "ghcr.io/agent-infra/sandbox:latest"
url = ""
api_key_env = "SANDBOX_API_KEY"
idle_minutes = 10
profile_dir = ""  # defaults to DOM_HOME/../desktop-profile
network = "dom-desktop"
subnet = "172.30.0.0/24"
port = 18080

[openers]
enabled = true
max_per_day = 2

[web]
enabled = false
bind = "127.0.0.1"
port = 8080
access_team = ""
access_aud = ""
access_emails = []  # optional: only these Access identities (the JWT email claim); empty admits anyone the Access policy admits
dev_token_env = ""  # env var name, for local testing
