<section class="panel" id="desktop">
  <header><h2>Desktop</h2></header>
  {% include "desktop_state.html" %}
  <iframe id="desktop-live" class="desktop-live" title="Live view"
    data-src="/desktop/vnc/index.html{{ context.q }}"
    {% if context.status == "ready" %}src="/desktop/vnc/index.html{{ context.q }}"{% else %}hidden{% endif %}>
  </iframe>
  {% if context.history %}{% with context = context.history %}{% include "desktop_history.html" %}{% endwith %}{% endif %}
</section>
