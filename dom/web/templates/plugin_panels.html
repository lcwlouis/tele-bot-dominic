{# Placeholders that load each approved panel with an htmx POST, so a slow plugin never delays the page. #}
<div class="plugin-panels">
  {% for name, panel in panels %}
  <article class="proposal" id="panel-{{ name }}-{{ panel.id }}"
           hx-post="/plugin-panels/{{ name }}/{{ panel.id }}" hx-trigger="load" hx-swap="outerHTML">
    <h3>{{ panel.title }}</h3>
    <p class="fog">Loading from plugin {{ name }}…</p>
  </article>
  {% endfor %}
</div>
