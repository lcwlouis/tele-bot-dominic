{% if trial %}
<details{% if trial.error %} open{% endif %}>
  <summary>Test run {{ "failed" if trial.error else "passed" }} · {{ trial.label }} · {{ trial.elapsed_ms }} ms</summary>
  <p>{{ test_run_detail(trial) }}</p>
</details>
{% else %}
<p class="fog">Test run {{ "pending" if trial_pending else "unavailable" }}.</p>
{% endif %}
