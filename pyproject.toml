[project]
name = "dom"
version = "0.8.2"
description = "Dom: a Telegram bot account that acts like a friend, and a personal assistant to its owner."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.32,<4",
    "fastapi",
    "httpx>=0.28",
    "jinja2",
    "markdown-it-py>=4.3.0",
    "pydantic>=2.11",
    "PyJWT[crypto]",
    "python-multipart>=0.0.34",
    "tomlkit>=0.13",
    "uvicorn>=0.30",
    "websockets>=15",
]

[project.scripts]
dom = "dom.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dom*"]

[tool.setuptools.package-data]
dom = [
    "desktop/seccomp-chromium.json",
    "desktop/README.md",
    "store/migrations/*.sql",
    "starter_home/*",
    "starter_home/.env.example",  # dotfiles are not matched by *
    "starter_home/*/*",
    "web/templates/*.html",
    "web/static/*",
    "web/static/fonts/*",
    "web/static/novnc/*",
    "web/static/novnc/**/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
