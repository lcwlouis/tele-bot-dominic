[project]
name = "dom"
version = "0.1.0"
description = "Dom: a Telegram bot account that acts like a friend, and a personal assistant to its owner."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.32,<4",
    "httpx>=0.28",
    "pydantic>=2.11",
]

[project.scripts]
dom = "dom.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dom*"]

[tool.setuptools.package-data]
dom = ["store/migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
