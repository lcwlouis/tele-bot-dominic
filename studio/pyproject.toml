[project]
name = "dom-studio"
version = "0.8.7"
requires-python = ">=3.12"
dependencies = ["starlette>=0.52,<1", "uvicorn>=0.34,<1", "pydantic>=2.11,<3", "python-multipart>=0.0.20,<1"]

[dependency-groups]
dev = ["httpx", "pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
